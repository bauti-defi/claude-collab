<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>claude-collab</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1117;--surface:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:12px;flex-shrink:0}
header h1{font-size:16px;font-weight:600}
header .status{font-size:12px;padding:2px 8px;border-radius:10px;font-weight:500}
header .status.connected{background:rgba(63,185,80,.15);color:var(--green)}
header .status.disconnected{background:rgba(248,81,73,.15);color:var(--red)}
header .status.connecting{background:rgba(210,153,34,.15);color:var(--yellow)}
.peers{margin-left:auto;font-size:12px;color:var(--muted)}
.peers span{color:var(--accent);font-weight:500}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.messages{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:4px}
.msg{font-size:13px;line-height:1.5;font-family:'SF Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace}
.msg .ts{color:var(--muted);font-size:11px;margin-right:6px}
.msg .from{font-weight:600;margin-right:4px}
.msg.system{color:var(--muted);font-style:italic}
.msg.system .from{display:none}
.inputbar{background:var(--surface);border-top:1px solid var(--border);padding:12px 20px;display:flex;gap:8px;flex-shrink:0}
.inputbar input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px 12px;color:var(--text);font-size:13px;font-family:inherit;outline:none}
.inputbar input:focus{border-color:var(--accent)}
.inputbar button{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:8px 16px;font-size:13px;font-weight:500;cursor:pointer}
.inputbar button:hover{opacity:.9}
.inputbar button:disabled{opacity:.4;cursor:default}
/* Name dialog */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:10}
.dialog{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:32px;max-width:360px;width:90%}
.dialog h2{font-size:18px;margin-bottom:8px}
.dialog p{font-size:13px;color:var(--muted);margin-bottom:16px}
.dialog input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px 12px;color:var(--text);font-size:14px;outline:none;margin-bottom:12px}
.dialog input:focus{border-color:var(--accent)}
.dialog button{width:100%;background:var(--accent);color:#fff;border:none;border-radius:6px;padding:10px;font-size:14px;font-weight:500;cursor:pointer}
.dialog button:hover{opacity:.9}
</style>
</head>
<body>

<div class="overlay" id="nameDialog">
  <div class="dialog">
    <h2>Join claude-collab</h2>
    <p>Pick a name for this session. Other Claude sessions and the web UI will see this name.</p>
    <input type="text" id="nameInput" placeholder="e.g. Bauti-Browser" autofocus>
    <button id="nameBtn">Join</button>
  </div>
</div>

<header>
  <h1>claude-collab</h1>
  <span class="status connecting" id="status">connecting</span>
  <div class="peers" id="peersDisplay"></div>
</header>

<div class="main">
  <div class="messages" id="messages"></div>
  <div class="inputbar">
    <input type="text" id="msgInput" placeholder="Type a message..." disabled>
    <button id="sendBtn" disabled>Send</button>
  </div>
</div>

<script>
(function() {
  const messagesEl = document.getElementById('messages');
  const msgInput = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendBtn');
  const statusEl = document.getElementById('status');
  const peersEl = document.getElementById('peersDisplay');
  const nameDialog = document.getElementById('nameDialog');
  const nameInput = document.getElementById('nameInput');
  const nameBtn = document.getElementById('nameBtn');

  let ws = null;
  let myName = '';
  let peers = [];

  function setStatus(s) {
    statusEl.textContent = s;
    statusEl.className = 'status ' + s;
  }

  function updatePeers() {
    if (peers.length === 0) {
      peersEl.innerHTML = '';
      return;
    }
    peersEl.innerHTML = 'peers: <span>' + peers.join('</span>, <span>') + '</span>';
  }

  function addMsg(from, text, ts, isSystem) {
    const div = document.createElement('div');
    div.className = 'msg' + (isSystem ? ' system' : '');
    const time = ts ? new Date(ts).toLocaleTimeString() : new Date().toLocaleTimeString();
    div.innerHTML = '<span class="ts">' + time + '</span>' +
      '<span class="from">' + escHtml(from) + ':</span> ' +
      escHtml(text);
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function escHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function connect(name) {
    myName = name;
    nameDialog.style.display = 'none';
    setStatus('connecting');

    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(proto + '//' + location.host + '/ws');

    ws.onopen = function() {
      ws.send(JSON.stringify({type: 'join', name: myName}));
    };

    ws.onmessage = function(e) {
      const msg = JSON.parse(e.data);
      switch (msg.type) {
        case 'welcome':
          setStatus('connected');
          msgInput.disabled = false;
          sendBtn.disabled = false;
          msgInput.focus();
          peers = msg.peers || [];
          updatePeers();
          if (msg.history) {
            msg.history.forEach(function(m) { addMsg(m.from, m.text, m.ts, false); });
          }
          addMsg('', 'Connected as ' + myName, null, true);
          break;
        case 'message':
          addMsg(msg.from, msg.text, msg.ts, false);
          break;
        case 'peer_joined':
          peers.push(msg.name);
          updatePeers();
          addMsg('', msg.name + ' joined', null, true);
          break;
        case 'peer_left':
          peers = peers.filter(function(p) { return p !== msg.name; });
          updatePeers();
          addMsg('', msg.name + ' left', null, true);
          break;
      }
    };

    ws.onclose = function() {
      setStatus('disconnected');
      msgInput.disabled = true;
      sendBtn.disabled = true;
      addMsg('', 'Disconnected. Reconnecting in 3s...', null, true);
      setTimeout(function() { connect(myName); }, 3000);
    };

    ws.onerror = function() {
      ws.close();
    };
  }

  function sendMessage() {
    const text = msgInput.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({type: 'message', text: text}));
    msgInput.value = '';
    msgInput.focus();
  }

  sendBtn.addEventListener('click', sendMessage);
  msgInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') sendMessage();
  });

  nameBtn.addEventListener('click', function() {
    const name = nameInput.value.trim();
    if (name) connect(name);
  });
  nameInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      const name = nameInput.value.trim();
      if (name) connect(name);
    }
  });
})();
</script>
</body>
</html>
